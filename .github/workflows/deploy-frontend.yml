name: Deploy Frontend to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/BetterMe.Web/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Publish Blazor WASM
        run: |
          export DOTNET_ROLL_FORWARD=LatestMajor
          dotnet publish src/BetterMe.Web/BetterMe.Web.csproj -c Release -o publish

      - name: Set production ApiBaseUrl
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL variable is required (Container App HTTPS URL)"
            exit 1
          fi
          printf '{"ApiBaseUrl":"%s"}\n' "$API_BASE_URL" > publish/wwwroot/appsettings.json
          cat publish/wwwroot/appsettings.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
