version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: suggestme_db
    environment:
      POSTGRES_DB: suggestme
      POSTGRES_USER: suggestme_user
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suggestme_user -d suggestme"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: suggestme_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@suggestme.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
